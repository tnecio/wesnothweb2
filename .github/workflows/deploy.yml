name: Deploy

# Production deploys come from version tags on main (docs/PHASE28_PLAN.md), staging deploys from `staging-*` tags on
# any branch (staging.wesnoth.fun); a manual run deploys the chosen ref to the chosen target.
on:
  push:
    tags: ['v*', 'staging-*']
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy (production only from a commit on main)
        type: choice
        options: [staging, production]
        default: staging

# One deploy at a time per target: a staging deploy never waits behind a production one.
concurrency:
  group: deploy-${{ (startsWith(github.ref_name, 'staging-') || inputs.target == 'staging') && 'staging' || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The R2 bucket's custom domain; the build reads game media from <origin>/<prefix> (upload-game-data.mjs).
  GAME_DATA_ORIGIN: https://data.wesnoth.fun
  R2_BUCKET: wesnothweb2-data
  STAGING: ${{ (startsWith(github.ref_name, 'staging-') || inputs.target == 'staging') && 'true' || 'false' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Production deploys only from main
        if: env.STAGING != 'true'
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main: production deploys come from main (use a staging-* tag for other branches)"
            exit 1
          }
          echo "Deploying $GITHUB_REF_NAME to production" | tee -a "$GITHUB_STEP_SUMMARY"
      - if: env.STAGING == 'true'
        run: echo "Deploying $GITHUB_REF_NAME to staging (https://staging.wesnoth.fun)" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/setup

      - id: inputs
        run: echo "hash=$(node --import tsx apps/web/scripts/rebuild-snapshots.mjs --inputs-hash)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: apps/web/public/scenarios
          key: scenarios-${{ steps.inputs.outputs.hash }}

      - name: Upload game media to R2
        id: data
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          node apps/web/scripts/upload-game-data.mjs | tee upload.log
          echo "prefix=$(tail -n 1 upload.log)" >> "$GITHUB_OUTPUT"

      - name: Allow cross-origin reads of the game media
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler r2 bucket cors set "$R2_BUCKET" --file r2-cors.json --force

      - name: Build
        env:
          VITE_GAME_DATA_URL: ${{ env.GAME_DATA_ORIGIN }}/${{ steps.data.outputs.prefix }}
          # Shown in error reports (and on the title screen): the tag, or the branch and run for a manual deploy.
          VITE_APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('{0}-run{1}', github.ref_name, github.run_number) }}
          VITE_APP_COMMIT: ${{ github.sha }}
          # Phase 32: the statistics and bug-report Worker (apps/stats), from the repository variable STATS_URL
          # (https://stats.wesnoth.fun). Unset, the game neither asks about statistics nor offers Send.
          VITE_STATS_URL: ${{ vars.STATS_URL }}
        run: |
          npm run build --workspace=apps/web
          node apps/web/scripts/stage-dist.mjs $([ "$STAGING" = true ] && echo --noindex)

      - name: Deploy to Cloudflare Workers
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy $([ "$STAGING" = true ] && echo --env staging) | tee deploy.log

      - name: Check the deployment
        env:
          DATA: ${{ env.GAME_DATA_ORIGIN }}/${{ steps.data.outputs.prefix }}
        run: |
          # Staging has only its custom domain (no workers.dev address).
          if [ "$STAGING" = true ]; then site=https://staging.wesnoth.fun; else site=$(grep -oE 'https://[^ ]+\.workers\.dev' apps/web/deploy.log | head -n 1); fi
          echo "Deployed to $site" | tee -a "$GITHUB_STEP_SUMMARY"
          # A first deploy's workers.dev address takes a minute or two to answer, so retry for up to ~3 minutes.
          check() {
            for i in $(seq 1 18); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$1")
              [ "$code" = 200 ] && echo "$code $1" && return 0
              sleep 10
            done
            echo "$code $1"; return 1
          }
          check "$site/"
          if [ "$STAGING" = true ]; then curl -sI "$site/" | grep -i '^x-robots-tag'; fi
          check "$site/play/liberty"
          check "$site/scenarios/_core.json"
          check "$DATA/game-images/core/images/maps/titlescreen.webp"
          curl -sI "$DATA/game-images/core/images/maps/titlescreen.webp" | grep -i '^cache-control'
          curl -sI -H 'Origin: https://example.org' "$DATA/game-images/core/images/maps/titlescreen.webp" | grep -i '^access-control-allow-origin'
