name: Deploy

# Production deploys come from version tags (docs/PHASE28_PLAN.md); a manual run deploys the chosen ref.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The R2 bucket's custom domain; the build reads game media from <origin>/<submodule commit>.
  GAME_DATA_ORIGIN: https://wesnoth-data.tnec.io
  R2_BUCKET: wesnothweb2-data

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - id: inputs
        run: echo "hash=$(node --import tsx apps/web/scripts/rebuild-snapshots.mjs --inputs-hash)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: apps/web/public/scenarios
          key: scenarios-${{ steps.inputs.outputs.hash }}

      - name: Upload game media to R2
        id: data
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          node apps/web/scripts/upload-game-data.mjs | tee upload.log
          echo "commit=$(tail -n 1 upload.log)" >> "$GITHUB_OUTPUT"

      - name: Allow cross-origin reads of the game media
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler r2 bucket cors set "$R2_BUCKET" --file r2-cors.json --force

      - name: Build
        env:
          VITE_GAME_DATA_URL: ${{ env.GAME_DATA_ORIGIN }}/${{ steps.data.outputs.commit }}
        run: |
          npm run build --workspace=apps/web
          node apps/web/scripts/stage-dist.mjs

      - name: Deploy to Cloudflare Workers
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy | tee deploy.log

      - name: Check the deployment
        env:
          DATA: ${{ env.GAME_DATA_ORIGIN }}/${{ steps.data.outputs.commit }}
        run: |
          site=$(grep -oE 'https://[^ ]+\.workers\.dev' apps/web/deploy.log | head -n 1)
          echo "Deployed to $site" | tee -a "$GITHUB_STEP_SUMMARY"
          check() { code=$(curl -s -o /dev/null -w '%{http_code}' "$1"); echo "$code $1"; [ "$code" = 200 ]; }
          check "$site/"
          check "$site/play/liberty"
          check "$site/scenarios/_core.json"
          check "$DATA/game-images/core/images/maps/titlescreen.webp"
          curl -sI "$DATA/game-images/core/images/maps/titlescreen.webp" | grep -i '^cache-control'
          curl -sI -H 'Origin: https://example.org' "$DATA/game-images/core/images/maps/titlescreen.webp" | grep -i '^access-control-allow-origin'
