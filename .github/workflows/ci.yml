name: CI

on:
  # Every branch, so a branch is checked before it is merged whether or not it has a PR.
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run typecheck --workspaces --if-present

  test:
    name: test (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: [engine, renderer, ui, lua-bridge, oracle-tools]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: vitest
        working-directory: packages/${{ matrix.package }}
        run: npx vitest run --reporter=default --reporter=github-actions
