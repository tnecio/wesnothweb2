name: CI

on:
  # Every branch, so a branch is checked before it is merged whether or not it has a PR.
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run typecheck --workspaces --if-present

  # Scenario snapshots are generated (not in git) and several suites read them: build them once per run,
  # cached by a hash of their inputs, and hand them to the test jobs.
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # The content must be upstream's, unmodified: the pinned submodule commit, no local edits, and no Lua
      # patches beyond the 8 known ones (Phase 28 S9).
      - run: node --import tsx apps/web/scripts/check-upstream-unmodified.mjs
      - id: inputs
        run: echo "hash=$(node --import tsx apps/web/scripts/rebuild-snapshots.mjs --inputs-hash)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@v6
        with:
          path: apps/web/public/scenarios
          key: scenarios-${{ steps.inputs.outputs.hash }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: npm run build:scenarios --workspace=apps/web
      - uses: actions/upload-artifact@v7
        with:
          name: scenarios
          path: apps/web/public/scenarios
          include-hidden-files: true
          retention-days: 1

  test:
    name: test (${{ matrix.package }})
    needs: scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: [engine, renderer, ui, lua-bridge, oracle-tools]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: scenarios
          path: apps/web/public/scenarios
      - if: matrix.package == 'ui'
        run: npm run build:help --workspace=apps/web
      - name: vitest
        working-directory: packages/${{ matrix.package }}
        run: npx vitest run --reporter=default --reporter=github-actions

  # Story assets and the title screen's image list are generated but committed: regenerate them from the
  # built scenarios and compare (a reader of the scenario files once lost every portrait after the database
  # split, and nothing noticed). Image variants are left out of the comparison: which ones are worth keeping
  # depends on the local WebP encoder's output size.
  generated-in-sync:
    needs: scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: scenarios
          path: apps/web/public/scenarios
      - name: Regenerate story assets
        run: |
          command -v identify >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick)
          find apps/web/public/derived-images -type f -exec touch {} +
          node --import tsx apps/web/scripts/build-story-assets.mjs
      - name: Same images referenced as committed
        run: node .github/scripts/json-diff.mjs --ignore-key variants --fail $(git ls-files apps/web/public/story) packages/ui/src/menu/titleImages.json
