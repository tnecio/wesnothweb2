name: CI

on:
  # Every branch, so a branch is checked before it is merged whether or not it has a PR.
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run typecheck --workspaces --if-present

  # Scenario snapshots are generated (not in git) and several suites read them: build them once per run,
  # cached by a hash of their inputs, and hand them to the test jobs.
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - id: inputs
        run: echo "hash=$(node --import tsx apps/web/scripts/rebuild-snapshots.mjs --inputs-hash)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@v4
        with:
          path: apps/web/public/scenarios
          key: scenarios-${{ steps.inputs.outputs.hash }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: npm run build:scenarios --workspace=apps/web
      - uses: actions/upload-artifact@v4
        with:
          name: scenarios
          path: apps/web/public/scenarios
          include-hidden-files: true
          retention-days: 1

  test:
    name: test (${{ matrix.package }})
    needs: scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: [engine, renderer, ui, lua-bridge, oracle-tools]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: scenarios
          path: apps/web/public/scenarios
      - name: vitest
        working-directory: packages/${{ matrix.package }}
        run: npx vitest run --reporter=default --reporter=github-actions

  # Story assets and the title screen's image list are generated but committed: regenerate them from the
  # built scenarios and fail on any difference (a reader of the scenario files once lost every portrait
  # after the database split, and nothing noticed).
  generated-in-sync:
    needs: scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: scenarios
          path: apps/web/public/scenarios
      - name: Regenerate story assets
        run: |
          command -v identify >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick)
          # Committed variants count as current: a runner's WebP encoder may produce different bytes. A missing
          # variant is still made (and fails the check below as a new file).
          find apps/web/public/derived-images -type f -exec touch {} +
          node --import tsx apps/web/scripts/build-story-assets.mjs
      - name: Nothing changed or appeared
        run: |
          changes=$(git status --porcelain -- apps/web/public/story apps/web/public/derived-images packages/ui/src/menu/titleImages.json)
          if [ -n "$changes" ]; then echo "$changes"; git diff --stat; node .github/scripts/json-diff.mjs $(git diff --name-only -- apps/web/public/story packages/ui/src/menu/titleImages.json | head -n 3); exit 1; fi

