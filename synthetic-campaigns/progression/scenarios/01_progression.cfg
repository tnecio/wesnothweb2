# Synthetic debug campaign: Scenario Progression (1/2).
#
# A tiny, fast-to-win scenario 1 chained to scenario 2 via next_scenario=,
# with a real "enemies defeated" -> [endlevel] (bonus=yes carryover_add=yes
# carryover_percentage=50 -- deliberately different from Dead Water's 40,
# so it's obviously this campaign's own configured value when debugging)
# for exercising GameSession.startNextScenario's real gold-carryover
# formula (see packages/engine/src/actions/carryover.ts) without Dead
# Water's length. "Recall Pal" survives and is NOT re-declared in
# scenario 2's [side] (unlike "Debug Hero", the leader, who is -- mirrors
# Dead Water's Kai Krellis pattern), so it exercises real recall-list
# carryover too.
#
# Real WML, real units, no macros -- see apps/web/scripts/
# build-scenario-snapshot.mjs's "Synthetic debug campaigns" doc comment.

[scenario]
    id=synth_progression_01
    name="Progression Debug (1/2)"
    map_file=progression1.map
    turns=10
    next_scenario=synth_progression_02

    [side]
        side=1
        controller=human
        team_name=good
        gold=80
        income=1
        village_gold=1
        type=Spearman
        id="Debug Hero"
        name="Debug Hero"
        canrecruit=yes
        x=1
        y=1
        recruit=Spearman,Bowman

        [unit]
            type=Bowman
            id="Recall Pal"
            name="Recall Pal"
            side=1
            x=2
            y=1
        [/unit]
    [/side]

    [side]
        side=2
        controller=human
        team_name=evil
        gold=50
        income=1
        village_gold=1
        type=Orcish Grunt
        id="Debug Villain"
        name="Debug Villain"
        canrecruit=yes
        x=9
        y=1
        recruit=Orcish Grunt
    [/side]

    [event]
        name="enemies defeated"
        [endlevel]
            result=victory
            bonus=yes
            carryover_add=yes
            carryover_percentage=50
        [/endlevel]
    [/event]
[/scenario]
