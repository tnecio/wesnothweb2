# Synthetic debug campaign: Scenario Progression (2/2).
#
# Re-declares "Debug Hero" fresh (mirrors Dead Water's {SIDE_1}/Kai Krellis
# pattern -- the leader is NOT expected to come from the recall list), on
# a visually distinct map (sand, not scenario 1's grassland) so a real
# board rebuild on transition is obvious at a glance, not just provable by
# inspecting network requests. "Recall Pal" (scenario 1's survivor) should
# show up in the Recall UI here. Terminal -- no next_scenario=.

[scenario]
    id=synth_progression_02
    name="Progression Debug (2/2)"
    map_file=progression2.map
    turns=10

    [side]
        side=1
        controller=human
        team_name=good
        gold=40
        income=1
        village_gold=1
        type=Spearman
        id="Debug Hero"
        name="Debug Hero"
        canrecruit=yes
        x=1
        y=1
        recruit=Spearman,Bowman
    [/side]

    [side]
        side=2
        controller=human
        team_name=evil
        gold=50
        income=1
        village_gold=1
        type=Orcish Grunt
        id="Debug Villain 2"
        name="Debug Villain 2"
        canrecruit=yes
        x=9
        y=1
        recruit=Orcish Grunt
    [/side]
[/scenario]
