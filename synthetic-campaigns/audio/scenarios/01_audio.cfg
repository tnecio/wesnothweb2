# Synthetic debug campaign: Audio (Phase 19).
#
# A wide map so the view can be scrolled toward and away from things that
# make noise, and one of everything the audio does that no shipped campaign
# does on a cold start: sound sources (two placed, one everywhere), a
# two-track [music] playlist, and -- at the start of turn 2 -- [volume],
# [remove_sound_source], a [sound] and a music change.
#
# Both sides are human, so the turn counter moves with two End Turns.

[scenario]
    id=synth_audio_01
    name="Audio Debug"
    map_file=audio.map
    turns=20

    [side]
        side=1
        controller=human
        team_name=good
        gold=100
        income=1
        village_gold=1
        type=Spearman
        id="Debug Hero"
        name="Debug Hero"
        x=3
        y=5
        recruit=Spearman,Bowman
    [/side]

    [side]
        side=2
        controller=human
        team_name=evil
        gold=100
        income=1
        village_gold=1
        type=Orcish Grunt
        id="Debug Villain"
        name="Debug Villain"
        x=38
        y=5
        recruit=Orcish Grunt,Orcish Archer
    [/side]

    [music]
        name=battle.ogg
    [/music]
    [music]
        name=suspense.ogg
        append=yes
    [/music]

    # Near the hero's start: loud there, gone from view a screen away.
    [sound_source]
        id=camp
        sounds=ambient/campfire.ogg
        x=4
        y=5
        delay=1000
        chance=100
        loop=-1
        full_range=3
        fade_range=8
    [/sound_source]

    # Far end of the map, for scrolling toward.
    [sound_source]
        id=birds
        sounds=ambient/birds1.ogg,ambient/birds2.ogg
        x=37
        y=5
        delay=2000
        chance=100
        loop=-1
        full_range=2
        fade_range=6
    [/sound_source]

    # No location: heard from everywhere.
    [sound_source]
        id=drums
        sounds=ambient/wardrums.ogg
        delay=3000
        chance=100
        loop=-1
    [/sound_source]

    [event]
        name=turn 2

        [volume]
            music=50
            sound=20
        [/volume]
        [remove_sound_source]
            id=drums
        [/remove_sound_source]
        [sound]
            name=open-chest.wav
            repeat=1
        [/sound]
        [music]
            name=sad.ogg
            immediate=yes
            ms_before=1500
        [/music]
    [/event]
[/scenario]
