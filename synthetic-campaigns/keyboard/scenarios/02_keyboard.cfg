# Synthetic debug campaign: Keyboard-only play (2/2). Terminal; it exists so the victory screen of
# scenario 1 has a real "Continue to next scenario" to reach with the keyboard, and (Phase 21) so the
# campaign can be *finished*: the enemy leader has one hit point, so one blow wins, which records the
# campaign as completed for the main menu's laurel.

[scenario]
    id=synth_keyboard_02
    name="Keyboard Play (2/2)"
    map_file=keyboard.map
    turns=10

    [side]
        side=1
        controller=human
        team_name=good
        gold=50
        income=1
        village_gold=1
        type=Mage
        id="Debug Hero"
        name="Debug Hero"
        canrecruit=yes
        x=2
        y=2
        recruit=Spearman,Bowman
    [/side]

    [side]
        side=2
        controller=human
        team_name=evil
        gold=50
        income=1
        village_gold=1
        type=Orcish Grunt
        id="Debug Villain 2"
        name="Debug Villain 2"
        canrecruit=yes
        x=4
        y=2
        recruit=Orcish Grunt
    [/side]

    [event]
        name=prestart
        [modify_unit]
            [filter]
                id="Debug Villain 2"
            [/filter]
            hitpoints=1
        [/modify_unit]
    [/event]

    [event]
        name="enemies defeated"
        [endlevel]
            result=victory
        [/endlevel]
    [/event]
[/scenario]
