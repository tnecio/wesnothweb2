# Synthetic debug campaign: Keyboard-only play (Phase 20).
#
# A whole scenario that can be played from a cold start to victory, and on into the next
# scenario, with the keyboard alone: a story screen, an objectives dialog, a message with an
# [option] prompt, moving, attacking (a magical attacker against a one-hit-point leader, so the
# exchange almost always ends the game), an advancement choice, and the victory screen with its
# Continue button. apps/web/scripts/keyboard-playthrough.mjs's `--keyboard-only` mode drives it
# without a single mouse event, which is the milestone for Phase 20's keyboard accessibility.
#
# Real WML, real units, no macros -- see apps/web/scripts/build-scenario-snapshot.mjs's
# "Synthetic debug campaigns" doc comment.

[scenario]
    id=synth_keyboard_01
    name="Keyboard Play (1/2)"
    map_file=keyboard.map
    turns=10
    next_scenario=synth_keyboard_02

    [story]
        [part]
            title="Keyboard Play"
            show_title=yes
            story="This scenario is played with the keyboard alone: Enter or Space moves on, Escape skips, the arrow keys choose, N picks your next unit and Ctrl+Space ends the turn."
        [/part]
    [/story]


    [side]
        side=1
        controller=human
        team_name=good
        gold=50
        income=1
        village_gold=1
        type=Mage
        id="Debug Hero"
        name="Debug Hero"
        canrecruit=yes
        x=2
        y=2
        recruit=Spearman,Bowman
    [/side]

    [side]
        side=2
        controller=human
        team_name=evil
        gold=50
        income=1
        village_gold=1
        type=Orcish Grunt
        id="Debug Villain"
        name="Debug Villain"
        canrecruit=yes
        x=4
        y=2
        recruit=Orcish Grunt
    [/side]

    [event]
        name=prestart
        [objectives]
            summary="Defeat the enemy leader."
            [objective]
                description="Defeat the enemy leader"
                condition=win
            [/objective]
            [objective]
                description="Death of your leader"
                condition=lose
            [/objective]
        [/objectives]

        # One hit ends the fight, and the hero is one kill from advancing.
        [modify_unit]
            [filter]
                id="Debug Villain"
            [/filter]
            hitpoints=1
        [/modify_unit]
        [modify_unit]
            [filter]
                id="Debug Hero"
            [/filter]
            experience=50
        [/modify_unit]
    [/event]

    [event]
        name=start

        [message]
            speaker=narrator
            image=wesnoth-icon.png
            message="Choose your road with the arrow keys, then press Enter."
            [option]
                message="The road to the north"
            [/option]
            [option]
                message="The road to the south"
            [/option]
        [/message]
    [/event]

    [event]
        name="enemies defeated"
        [endlevel]
            result=victory
        [/endlevel]
    [/event]
[/scenario]
