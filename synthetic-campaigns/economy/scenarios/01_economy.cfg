# Synthetic debug campaign: Economy & Recruit.
#
# A leader on a real keep (Kh) with a full ring of six vacant castle (Ch)
# tiles and starting gold, for exercising recruit/gold math without Dead
# Water's turns of setup first. A single, distant, non-threatening enemy
# leader is included so recruited units have something to eventually walk
# toward -- this campaign is about the economy loop (gold -> recruit ->
# board), not combat (see the "combat" synthetic campaign for that).
#
# Real WML, real units, no macros -- see apps/web/scripts/
# build-scenario-snapshot.mjs's "Synthetic debug campaigns" doc comment.

[scenario]
    id=synth_economy_01
    name="Economy Debug"
    map_file=economy.map
    turns=30

    [side]
        side=1
        controller=human
        team_name=good
        gold=40
        income=2
        village_gold=1
        type=Spearman
        id="Debug Hero"
        name="Debug Hero"
        x=4
        y=4
        recruit=Spearman,Bowman,Cavalryman,Mage
    [/side]

    [side]
        side=2
        controller=human
        team_name=evil
        gold=50
        income=1
        village_gold=1
        type=Orcish Grunt
        id="Debug Villain"
        name="Debug Villain"
        x=1
        y=1
        recruit=Orcish Grunt,Orcish Archer
    [/side]
[/scenario]
