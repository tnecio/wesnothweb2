# Synthetic debug campaign: Plague.
#
# A real, reported bug: a player's unit killed by a Walking Corpse or Soulless during the AI's turn did not
# rise as a Walking Corpse. Every station is a side 1 (human) unit at 1 HP next to a side 2 (AI) plague
# unit; ending turn 1 lets the AI kill them. Upstream's `attack::unit_killed` raises each victim as the
# plague type, in the victim's `undead_variation` (its type's, else its race's), healed full -- unless it
# dies on a village or is unplagueable.
#
# Stations (side 1 victim at x=3, side 2 killer at x=4):
#   y=3  Spearman           vs Walking Corpse -- human: the plain Walking Corpse.
#   y=5  Merman Fighter     vs Soulless       -- in water: merfolk rise as a swimmer.
#   y=7  Dwarvish Fighter   vs Walking Corpse -- dwarf.
#   y=9  Cavalryman         vs Soulless       -- the type's own undead_variation=mounted.
#   y=11 Drake Fighter      vs Walking Corpse -- drake.
#   y=13 Troll Whelp        vs Soulless       -- troll.
#   y=15 Saurian Skirmisher vs Walking Corpse -- saurian.
#   y=17 Wose               vs Soulless       -- wose.
#   y=19 Gryphon Rider      vs Walking Corpse -- gryphon.
#   y=21 Peasant on a village vs Soulless     -- dies on a village: no corpse.
#   y=23 Walking Corpse     vs Walking Corpse -- unplagueable: no corpse.
#   y=25 Elvish Scout       vs Soulless       -- an elf whose type says undead_variation=mounted.
#
# Real WML, real units, no macros.

[scenario]
    id=synth_plague_01
    name="Plague Debug"
    map_file=plague.map
    turns=50

