# Synthetic debug campaign: Unit Advancement.
#
# Two "stations", each a real unit one real combat-XP gain away from
# advancing, next to a real, deliberately weak (hitpoints=1) target --
# attack immediately to see a real advances_to= happen:
#
#   y=3  Debug Archer (Bowman, experience=34/35) vs Target A -- SINGLE
#        real advances_to= option (Longbowman). Advances immediately,
#        no choice to make (matches real Wesnoth: the dialog only
#        appears when there's an actual choice).
#   y=5  Debug Spearman (Spearman, experience=41/42) vs Target B -- REAL
#        3-way advances_to= (Swordsman, Pikeman, Javelineer). Landing
#        the kill opens the real advancement-choice dialog
#        (AdvancementDialog.svelte) -- pick any of the three to see it
#        actually change type, fully heal, and reset XP (overflow
#        carried over).
#
# Real WML, real units, no macros -- see apps/web/scripts/
# build-scenario-snapshot.mjs's "Synthetic debug campaigns" doc comment.

[scenario]
    id=synth_advancement_01
    name="Unit Advancement Debug"
    map_file=advancement.map
    turns=50

    [side]
        side=1
        controller=human
        team_name=good
        gold=100
        income=1
        village_gold=1
        type=Spearman
        id="Debug Hero"
        name="Debug Hero"
        canrecruit=yes
        x=1
        y=1
        recruit=Spearman
    [/side]

    [side]
        side=2
        controller=human
        team_name=evil
        gold=100
        income=1
        village_gold=1
        type=Orcish Grunt
        id="Debug Villain"
        name="Debug Villain"
        canrecruit=yes
        x=8
        y=2
        recruit=Orcish Grunt
    [/side]

    # -- single-option advance: Bowman -> Longbowman only --
    [unit]
        type=Bowman
        side=1
        id="Debug Archer"
        name="Debug Archer"
        x=3
        y=3
        experience=34
    [/unit]
    [unit]
        type=Peasant
        side=2
        id="Target A"
        name="Target A"
        x=4
        y=3
        hitpoints=1
    [/unit]

    # -- multi-option advance: Spearman -> Swordsman/Pikeman/Javelineer --
    [unit]
        type=Spearman
        side=1
        id="Debug Spearman"
        name="Debug Spearman"
        x=3
        y=5
        experience=41
    [/unit]
    [unit]
        type=Peasant
        side=2
        id="Target B"
        name="Target B"
        x=4
        y=5
        hitpoints=1
    [/unit]

    [event]
        name=prestart

        [objectives]
            side=1
            [objective]
                description= _ "Defeat the enemy leader"
                condition=win
            [/objective]
            [objective]
                description= _ "Attack each station's weak target to see it advance -- Debug Archer advances immediately (one real option); Debug Spearman opens the real advancement-choice dialog (three real options)"
                condition=win
            [/objective]
            [note]
                description= _ "Nothing here is scripted or faked: both attackers are real Wesnoth unit types one real combat-XP gain away from their real experience= threshold, and both targets are real, deliberately weak (1 HP) so a landed hit is (very likely, not guaranteed) lethal."
            [/note]
        [/objectives]
    [/event]
[/scenario]
