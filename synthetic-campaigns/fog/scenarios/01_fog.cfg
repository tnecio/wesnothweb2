# Synthetic debug campaign: Fog of War & Shroud.
#
# Two leaders on opposite corners of a mostly-empty 10x10 board, each with
# fog=yes/shroud=yes, and two villages in the unexplored middle -- for
# exercising shroud-clearing-on-move, fog re-covering an unoccupied-but-
# previously-seen hex, and vision-based unit-list visibility without
# Under the Burning Suns' story/event setup first (see the "economy"/
# "combat" synthetic campaigns for the same idea applied to other systems).
#
# Real WML, real units, no macros -- see apps/web/scripts/
# build-scenario-snapshot.mjs's "Synthetic debug campaigns" doc comment.

[scenario]
    id=synth_fog_01
    name="Fog of War Debug"
    map_file=fog.map
    turns=20

    [side]
        side=1
        controller=human
        team_name=good
        gold=50
        income=2
        village_gold=1
        type=Spearman
        id="Debug Hero"
        name="Debug Hero"
        x=2
        y=2
        recruit=Spearman,Bowman,Cavalryman
        fog=yes
        shroud=yes
    [/side]

    [side]
        side=2
        controller=human
        team_name=evil
        gold=50
        income=2
        village_gold=1
        type=Orcish Grunt
        id="Debug Villain"
        name="Debug Villain"
        x=9
        y=9
        recruit=Orcish Grunt,Orcish Archer
        fog=yes
        shroud=yes
    [/side]
[/scenario]
