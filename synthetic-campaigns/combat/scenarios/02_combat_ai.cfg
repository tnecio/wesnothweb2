# Synthetic debug campaign: Combat (AI-vs-AI).
#
# Both sides controller=ai, each with a real keep+castle and a
# recruitable roster, three neutral villages contested in the middle --
# built for Phase 29 S6's headless benchmark harness
# (packages/ui/scripts/ai-benchmark.ts), which needs a scenario the real
# RCA framework can play start-to-finish on both sides without any human
# input, unlike `01_combat.cfg` (controller=human, no keeps -- fine for a
# single click-through, useless for measuring the AI itself).
#
# Real WML, real units (Spearman/Bowman vs. Orcish Grunt/Orcish Archer,
# real data/core/units/ types with real stats), no macros -- see
# `01_combat.cfg`'s own doc comment for the synthetic-campaign
# conventions this relies on (spawnUnitsFromTree: true, no
# campaign-specific macro flags).

[scenario]
    id=synth_combat_02
    name="Combat AI Debug"
    map_file=combat_ai.map
    turns=40

    [side]
        side=1
        controller=ai
        team_name=good
        gold=100
        income=2
        village_gold=2
        type=Spearman
        id="AI Hero"
        name="AI Hero"
        canrecruit=yes
        x=1
        y=1
        recruit=Spearman,Bowman
    [/side]

    [side]
        side=2
        controller=ai
        team_name=evil
        gold=100
        income=2
        village_gold=2
        type=Orcish Grunt
        id="AI Villain"
        name="AI Villain"
        canrecruit=yes
        x=9
        y=7
        recruit=Orcish Grunt,Orcish Archer
    [/side]
[/scenario]
