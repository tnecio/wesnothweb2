# Synthetic debug campaign: Combat.
#
# Two leaders placed adjacent on a tiny, uniform grassland map so combat
# (real attack_prediction/executeAttack math, real per-unit-type stats,
# real terrain defense) can be exercised in a single click, no setup turns
# needed. See docs/PROGRESS.md for why this exists: debugging combat
# through a real campaign like Dead Water means several turns of movement
# and event click-through first every single time.
#
# Real WML, real units (Spearman/Orcish Grunt, both real data/core/units/
# types with real stats), no macros -- deliberately minimal, see
# apps/web/scripts/build-scenario-snapshot.mjs's "Synthetic debug
# campaigns" doc comment for the build-time conventions this relies on
# (spawnUnitsFromTree: true, no campaign-specific macro flags).

[scenario]
    id=synth_combat_01
    name="Combat Debug"
    map_file=combat.map
    turns=20

    [side]
        side=1
        controller=human
        team_name=good
        gold=100
        income=1
        village_gold=1
        type=Spearman
        id="Debug Hero"
        name="Debug Hero"
        x=2
        y=3
        recruit=Spearman,Bowman
    [/side]

    [side]
        side=2
        controller=human
        team_name=evil
        gold=100
        income=1
        village_gold=1
        type=Orcish Grunt
        id="Debug Villain"
        name="Debug Villain"
        x=3
        y=3
        recruit=Orcish Grunt,Orcish Archer
    [/side]

    # Phase 14: a real `[set_menu_item]` -- exercises the engine's WML/Lua
    # extensibility hook for the right-click context menu (see
    # packages/engine/src/events/actionWml.ts's `actionSetMenuItem`/
    # `actionHealUnit`). No `[filter]` on `[heal_unit]`: it defaults to
    # whichever unit is at the right-clicked hex ($x1,$y1), exactly like
    # real Wesnoth's own `data/lua/wml/heal_unit.lua` default -- so this
    # entry resets HP for whichever combatant you right-click, not just
    # the two starting leaders.
    [event]
        name=prestart
        [set_menu_item]
            id=reset_hp
            description="Reset HP"
            [command]
                [heal_unit]
                [/heal_unit]
            [/command]
        [/set_menu_item]
    [/event]
[/scenario]
