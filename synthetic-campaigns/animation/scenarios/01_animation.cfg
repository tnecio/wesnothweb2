# Synthetic debug campaign: Animation.
#
# A testbed for movement/appearance animation glitches -- units jumping
# back and forth between hexes before settling, an action's animation
# playing at the wrong hex, several animations fighting over the same
# sprite. Reported against Dead Water 1's opening (the enemy recruits a
# Skeleton and walks it toward the player, and the Skeleton jumps
# between hexes on the way), and long-standing for a Horseman/Knight
# multi-hex ride.
#
# Reaching those cases in a real campaign means minutes of story,
# dialogue and setup turns every single time. Here each one is a single
# click from a cold load:
#
#   AI recruit + move    End Turn. Side 2 is `controller=ai` with a keep,
#                        a castle ring, gold and `recruit=Skeleton`, and
#                        nothing to do but recruit and walk toward you --
#                        the exact Dead Water 1 shape.
#   Scripted spawn+move  Right-click anywhere -> "Spawn + move (cutscene)":
#                        `[unit] animate=yes` then `[move_unit]`, the
#                        Phase 17 beat pair Dead Water 1's own start
#                        event uses.
#   Long ride            Right-click -> "Ride across the field": the
#                        Horseman crosses six hexes of open grass, where
#                        a per-step animation glitch is easiest to see.
#   Fake unit            Right-click -> "Fake unit flies past":
#                        `[move_unit_fake]`, a sprite that exists only
#                        for the animation.
#
# The menu items are repeatable (`[set_menu_item]` entries stay
# registered), so a glitch can be re-run as many times as it takes
# without reloading the scenario.
#
# Real WML, real units, no macros -- see apps/web/scripts/
# build-scenario-snapshot.mjs's "Synthetic debug campaigns" doc comment.

[scenario]
    id=synth_animation_01
    name="Animation Debug"
    map_file=animation.map
    turns=30

    [side]
        side=1
        controller=human
        team_name=good
        gold=100
        income=2
        village_gold=1
        type=Horseman
        id="Debug Rider"
        name="Debug Rider"
        x=2
        y=4
        recruit=Horseman,Spearman

        # A second fast unit, so two multi-hex rides can be compared
        # side by side in one turn.
        [unit]
            type=Knight
            id="Debug Knight"
            name="Debug Knight"
            x=2
            y=6
            side=1
        [/unit]
    [/side]

    [side]
        side=2
        controller=ai
        team_name=evil
        gold=200
        income=2
        village_gold=1
        type=Dark Adept
        id="Debug Necromancer"
        name="Debug Necromancer"
        x=10
        y=4
        recruit=Skeleton,Walking Corpse
    [/side]

    [event]
        name=prestart

        # Repeatable triggers for the scripted cases. No [filter] on the
        # spawn: `x,y=$x1,$y1` is the hex that was right-clicked, exactly
        # like Dead Water 1's own `[unit]`/`[move_unit]` pair.
        [set_menu_item]
            id=anim_spawn_move
            description="Spawn + move (cutscene)"
            [command]
                [unit]
                    type=Skeleton
                    side=2
                    x,y=$x1,$y1
                    animate=yes
                [/unit]
                [move_unit]
                    type=Skeleton
                    x,y=$x1,$y1
                    to_x=6
                    to_y=4
                [/move_unit]
            [/command]
        [/set_menu_item]

        [set_menu_item]
            id=anim_long_ride
            description="Ride across the field"
            [command]
                [move_unit]
                    id="Debug Rider"
                    to_x=9
                    to_y=7
                [/move_unit]
            [/command]
        [/set_menu_item]

        [set_menu_item]
            id=anim_fake_unit
            description="Fake unit flies past"
            [command]
                [move_unit_fake]
                    type=Ghost
                    side=2
                    x=12,1
                    y=1,8
                [/move_unit_fake]
            [/command]
        [/set_menu_item]

        [set_menu_item]
            id=anim_reset
            description="Reset the rider to the start"
            [command]
                [move_unit]
                    id="Debug Rider"
                    to_x=2
                    to_y=4
                [/move_unit]
            [/command]
        [/set_menu_item]
    [/event]

    [event]
        name=start

        # Dead Water 1's opening shape, played once at scenario start:
        # a scripted spawn that animates, then walks. This is the
        # sequence the reported glitch was seen in.
        [message]
            speaker=narrator
            image=wesnoth-icon.png
            message="Animation testbed. End Turn to watch the AI recruit and march; right-click for the scripted cases."
        [/message]

        [unit]
            type=Skeleton
            id="Debug Walker"
            name="Debug Walker"
            side=2
            x=9
            y=7
            animate=yes
        [/unit]

        [move_unit]
            id="Debug Walker"
            to_x=6
            to_y=7
        [/move_unit]

        [message]
            speaker=narrator
            image=wesnoth-icon.png
            message="That was a scripted spawn followed by a move -- the shape Dead Water 1 opens with."
        [/message]
    [/event]
[/scenario]
