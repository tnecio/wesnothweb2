# Synthetic debug campaign: Abilities & Specials.
#
# One "station" per row: a real unit (side 1) demonstrating one real
# ability/weapon-special, adjacent to a real "target dummy" (side 2) to
# attack immediately -- no setup turns, no travel. Every unit here is a
# REAL wesnoth/data/core/units/ type with its REAL specials_list=/
# abilities_list= (the shorthand real content overwhelmingly uses, not
# hand-authored inline [specials]/[abilities] blocks) -- this scenario
# exists specifically to exercise that resolution path end-to-end, plus
# the real per-blow combat log, terrain-defense display, and turn-start
# healing added alongside it (see docs/PROGRESS.md).
#
# Real WML, real units, no macros -- see apps/web/scripts/
# build-scenario-snapshot.mjs's "Synthetic debug campaigns" doc comment.
#
# Stations (row y=, all side 1 unit at x=3 unless noted):
#   y=3  Giant Spider vs Bandit    -- poison (fangs) / slow (web): pick a weapon.
#   y=5  Vampire Bat vs Bandit     -- drains.
#   y=7  Dwarvish Berserker vs Bandit -- berserk.
#   y=9  Drake Arbiter vs Bandit   -- firststrike.
#   y=11 Elvish Marksman vs Bandit -- marksman (>=60% chance to hit, always).
#   y=13 Dwarvish Arcanister vs Bandit -- magical (fixed CTH both ways).
#   y=15 Thief vs Bandit (+ Peasant ally at x=5) -- backstab.
#   y=17 Horseman vs Bandit        -- charge (double damage both ways).
#   y=19 Cuttlefish vs Bandit      -- swarm (tentacle) / poison (ink).
#   y=21 Walking Corpse vs weak Bandit -- plague (kills -> raises a Walking Corpse).
#   y=23 Mermaid Priestess + damaged Peasant -- heals (end turn to see it heal).
#   y=25 damaged Troll             -- regenerate (end turn to see it self-heal).
#   y=27 Assassin vs Orcish Grunt  -- skirmisher (ignores the Grunt's real ZoC).

[scenario]
    id=synth_abilities_01
    name="Abilities & Specials Debug"
    map_file=abilities.map
    turns=50

    [side]
        side=1
        controller=human
        team_name=good
        gold=100
        income=1
        village_gold=1
        type=Spearman
        id="Debug Hero"
        name="Debug Hero"
        canrecruit=yes
        x=1
        y=1
        recruit=Spearman
    [/side]

    [side]
        side=2
        controller=human
        team_name=evil
        gold=100
        income=1
        village_gold=1
        type=Orcish Grunt
        id="Debug Villain"
        name="Debug Villain"
        canrecruit=yes
        x=8
        y=1
        recruit=Orcish Grunt
    [/side]

    # -- poison / slow (weapon choice) --
    [unit]
        type=Giant Spider
        side=1
        id="Debug Spider"
        name="Debug Spider"
        x=3
        y=3
    [/unit]
    [unit]
        type=Bandit
        side=2
        id="Target Poison-Slow"
        name="Target Poison-Slow"
        x=4
        y=3
    [/unit]

    # -- drains --
    [unit]
        type=Vampire Bat
        side=1
        id="Debug Bat"
        name="Debug Bat"
        x=3
        y=5
    [/unit]
    [unit]
        type=Bandit
        side=2
        id="Target Drain"
        name="Target Drain"
        x=4
        y=5
    [/unit]

    # -- berserk --
    [unit]
        type=Dwarvish Berserker
        side=1
        id="Debug Berserker"
        name="Debug Berserker"
        x=3
        y=7
    [/unit]
    [unit]
        type=Bandit
        side=2
        id="Target Berserk"
        name="Target Berserk"
        x=4
        y=7
    [/unit]

    # -- firststrike --
    [unit]
        type=Drake Arbiter
        side=1
        id="Debug Arbiter"
        name="Debug Arbiter"
        x=3
        y=9
    [/unit]
    [unit]
        type=Bandit
        side=2
        id="Target Firststrike"
        name="Target Firststrike"
        x=4
        y=9
    [/unit]

    # -- marksman --
    [unit]
        type=Elvish Marksman
        side=1
        id="Debug Marksman"
        name="Debug Marksman"
        x=3
        y=11
    [/unit]
    [unit]
        type=Bandit
        side=2
        id="Target Marksman"
        name="Target Marksman"
        x=4
        y=11
    [/unit]

    # -- magical --
    [unit]
        type=Dwarvish Arcanister
        side=1
        id="Debug Arcanister"
        name="Debug Arcanister"
        x=3
        y=13
    [/unit]
    [unit]
        type=Bandit
        side=2
        id="Target Magical"
        name="Target Magical"
        x=4
        y=13
    [/unit]

    # -- backstab: attacker -- defender -- ally, in a straight line --
    [unit]
        type=Thief
        side=1
        id="Debug Thief"
        name="Debug Thief"
        x=3
        y=15
    [/unit]
    [unit]
        type=Bandit
        side=2
        id="Target Backstab"
        name="Target Backstab"
        x=4
        y=15
    [/unit]
    [unit]
        type=Peasant
        side=1
        id="Backstab Buddy"
        name="Backstab Buddy"
        x=5
        y=15
    [/unit]

    # -- charge --
    [unit]
        type=Horseman
        side=1
        id="Debug Horseman"
        name="Debug Horseman"
        x=3
        y=17
    [/unit]
    [unit]
        type=Bandit
        side=2
        id="Target Charge"
        name="Target Charge"
        x=4
        y=17
    [/unit]

    # -- swarm (+ poison as a bonus second weapon) --
    [unit]
        type=Cuttle Fish
        side=1
        id="Debug Cuttlefish"
        name="Debug Cuttlefish"
        x=3
        y=19
    [/unit]
    [unit]
        type=Bandit
        side=2
        id="Target Swarm"
        name="Target Swarm"
        x=4
        y=19
    [/unit]

    # -- plague: a deliberately weak target so it dies (and rises again) fast --
    [unit]
        type=Walking Corpse
        side=1
        id="Debug Plaguebearer"
        name="Debug Plaguebearer"
        x=3
        y=21
    [/unit]
    [unit]
        type=Bandit
        side=2
        id="Target Plague"
        name="Target Plague"
        x=4
        y=21
        hitpoints=6
    [/unit]

    # -- heals: end your turn to see the Priestess heal the damaged Peasant --
    [unit]
        type=Mermaid Priestess
        side=1
        id="Debug Priestess"
        name="Debug Priestess"
        x=3
        y=23
    [/unit]
    [unit]
        type=Peasant
        side=1
        id="Heal Patient"
        name="Heal Patient"
        x=4
        y=23
        hitpoints=10
    [/unit]

    # -- regenerate: end your turn to see the Troll self-heal --
    [unit]
        type=Troll
        side=1
        id="Debug Troll"
        name="Debug Troll"
        x=3
        y=25
        hitpoints=20
    [/unit]

    # -- skirmisher: select the Assassin and compare its (unrestricted)
    #    reachable-hex highlight to a non-skirmisher unit's, against the
    #    real Orcish Grunt's real zone of control (level=1 -> zoc=yes by
    #    default, no special-casing needed). --
    [unit]
        type=Assassin
        side=1
        id="Debug Assassin"
        name="Debug Assassin"
        x=3
        y=27
    [/unit]
    [unit]
        type=Orcish Grunt
        side=2
        id="ZoC Grunt"
        name="ZoC Grunt"
        x=4
        y=27
    [/unit]

    [event]
        name=prestart

        [objectives]
            side=1
            [objective]
                description= _ "Defeat the enemy leader"
                condition=win
            [/objective]
            [objective]
                description= _ "Try each station's weapon/ability against its real target -- see this scenario's own file header for what each one demonstrates"
                condition=win
            [/objective]
            [note]
                description= _ "Nothing here is scripted or faked: every unit is a real Wesnoth unit type using its real specials_list=/abilities_list= shorthand."
            [/note]
        [/objectives]
    [/event]
[/scenario]
