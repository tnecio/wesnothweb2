# Synthetic debug campaign: Dialogue & Choices (Phase 17).
#
# Everything the suspendable event pump brought in, reachable from a cold
# start in one click: a blocking [message], a [move_unit_fake] flight, a
# [scroll_to], an [option] prompt whose [command] bodies branch the
# scenario, a [text_input], and a [foreach] over a real array.
#
# It exists because the real content that needs these cannot be reached
# cold: Two Brothers 3's password puzzle only offers its options to
# Arvith, who arrives on the recall list from scenario 2, so a browser
# opening scenario 3 directly has no speaker and upstream's own
# get_speaker rule (rightly) skips the message. The branch-taking itself
# is covered on the real scenario in packages/ui/src/phase17Milestone.test.ts;
# this is where the *UI* is exercised.
#
# Real WML, real units, no macros -- see apps/web/scripts/
# build-scenario-snapshot.mjs's "Synthetic debug campaigns" doc comment.

[scenario]
    id=synth_dialogue_01
    name="Dialogue Debug"
    map_file=dialogue.map
    turns=20

    [side]
        side=1
        controller=human
        team_name=good
        gold=100
        income=1
        village_gold=1
        type=Spearman
        id="Debug Hero"
        name="Debug Hero"
        x=2
        y=3
        recruit=Spearman,Bowman
    [/side]

    [side]
        side=2
        controller=human
        team_name=evil
        gold=100
        income=1
        village_gold=1
        type=Orcish Grunt
        id="Debug Villain"
        name="Debug Villain"
        x=5
        y=3
        recruit=Orcish Grunt,Orcish Archer
    [/side]

    [event]
        name=prestart

        # A [foreach] over a real array, the shape Under the Burning Suns
        # uses in its own prestart.
        [set_variables]
            name=scouts
            [value]
                name=Aldrin
                cost=14
            [/value]
            [value]
                name=Beryl
                cost=20
            [/value]
            [value]
                name=Cyrus
                cost=6
            [/value]
        [/set_variables]
        [set_variable]
            name=scout_budget
            value=0
        [/set_variable]
        [foreach]
            array=scouts
            [do]
                [set_variable]
                    name=scout_budget
                    add=$this_item.cost
                [/set_variable]
                [set_variable]
                    name=roll_call
                    suffix="$this_item.name| "
                [/set_variable]
            [/do]
        [/foreach]
    [/event]

    [event]
        name=start

        [message]
            speaker=narrator
            image=wesnoth-icon.png
            message="The scouts report in: $roll_call|(a wage bill of $scout_budget| gold)."
        [/message]

        # A sprite that exists only for the animation, flying across the
        # board before anyone says anything about it.
        [move_unit_fake]
            type=Ghost
            side=2
            x=5,3
            y=1,3
        [/move_unit_fake]

        [scroll_to]
            x=3
            y=3
        [/scroll_to]

        [message]
            speaker="Debug Villain"
            message="Something drifted past. Which way do we march?"
        [/message]

        # The [option] prompt: no value= on any option, so `variable=`
        # receives the 1-based index of the option the player picked --
        # exactly the shape Two Brothers 3's password puzzle relies on.
        [message]
            speaker="Debug Hero"
            message="We have a choice to make."
            variable=road_picked
            [option]
                label="North, into the hills."
                [command]
                    [set_variable]
                        name=road
                        value=hills
                    [/set_variable]
                [/command]
            [/option]
            [option]
                label="South, along the river."
                [command]
                    [set_variable]
                        name=road
                        value=river
                    [/set_variable]
                [/command]
            [/option]
            [option]
                label="Stay here and fortify."
                [command]
                    [set_variable]
                        name=road
                        value=camp
                    [/set_variable]
                [/command]
            [/option]
        [/message]

        [switch]
            variable=road
            [case]
                value=hills
                [message]
                    speaker="Debug Hero"
                    message="The hills it is. Choice 1 of 3 taken (road_picked=$road_picked|)."
                [/message]
            [/case]
            [case]
                value=river
                [message]
                    speaker="Debug Hero"
                    message="The river it is. Choice 2 of 3 taken (road_picked=$road_picked|)."
                [/message]
            [/case]
            [else]
                [message]
                    speaker="Debug Hero"
                    message="We stay. Choice 3 of 3 taken (road_picked=$road_picked|)."
                [/message]
            [/else]
        [/switch]

        [message]
            speaker="Debug Hero"
            message="And what shall they call this camp?"
            [text_input]
                variable=camp_name
                label="Camp name"
                text="Rivermeet"
                max_length=24
            [/text_input]
        [/message]

        [message]
            speaker=narrator
            image=wesnoth-icon.png
            message="So it was named $camp_name|."
        [/message]
    [/event]
[/scenario]
